# ---------------------------------------------------------------------------
# nginx interno de cada microfrontend (shell y remotes).
# Copiar a frontend/<nombre>/nginx.conf — el Dockerfile lo espera ahí.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # CORS abierto para los assets federados. Con el edge delante todo viaja
    # bajo el mismo origen y esto es redundante; se deja porque permite
    # también el modo "puerto directo" (http://localhost:3001), útil para
    # desarrollar un remote aislado del resto.
    location ~* \.(js|mjs|json|css|map)$ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # remoteEntry.js es el manifiesto de Module Federation: nunca cachearlo.
    location = /remoteEntry.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html para que el router
    # del lado del cliente resuelva (p. ej. recargar en /mis-reservas).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
