# ---------------------------------------------------------------------------
# infra/edge/nginx.conf — el edge: un solo origen para todo el sistema.
#
# El navegador solo conoce http://localhost. Desde ahí salen el shell, los tres
# remotes y la API. Esto es lo que elimina el CORS de los chunks federados sin
# parchearlo con cabeceras permisivas en cada servicio, y lo que hace que el
# gateway sea el único camino del navegador hacia el backend: el edge es el
# único contenedor conectado a las redes `frontend` y `backend` a la vez.
#
# Ver quickstart.md § infra/edge/nginx.conf.
# ---------------------------------------------------------------------------

# DNS interno de Docker. Con él, los upstream se resuelven en cada petición y no
# al arrancar: el edge levanta aunque un servicio todavía no esté en pie —caso
# normal mientras el sistema se construye por fases— y devuelve 502 solo en esa
# ruta, en lugar de negarse a arrancar entero con "host not found in upstream".
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Los remotes federados sirven bundles grandes; sin esto nginx los trunca.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Los upstream van en variables: es lo que fuerza la resolución diferida.
    set $shell_upstream             http://shell:80;
    set $mf_reservas_upstream       http://mf-reservas:80;
    set $mf_administracion_upstream http://mf-administracion:80;
    set $mf_reportes_upstream       http://mf-reportes:80;
    set $gateway_upstream           http://gateway:8080;

    # --- La API: único camino del navegador hacia el backend ----------------
    # Sin reescritura: el gateway recibe /api/... tal cual, que es como están
    # definidas sus rutas.
    location /api/ {
        proxy_pass $gateway_upstream;
    }

    # --- Cada remote bajo el prefijo con el que se compiló (PUBLIC_PATH) -----
    # El `rewrite ... break` quita el prefijo, porque el nginx interno de cada
    # remote sirve desde su raíz. El prefijo TIENE que coincidir con el
    # PUBLIC_PATH del build (docker-compose.yml): si no, el remote carga su
    # remoteEntry.js pero pide sus chunks contra una ruta que no existe, y falla
    # solo al navegar a esa sección.
    location /mf-reservas/ {
        rewrite ^/mf-reservas/(.*)$ /$1 break;
        proxy_pass $mf_reservas_upstream;
    }

    location /mf-administracion/ {
        rewrite ^/mf-administracion/(.*)$ /$1 break;
        proxy_pass $mf_administracion_upstream;
    }

    location /mf-reportes/ {
        rewrite ^/mf-reportes/(.*)$ /$1 break;
        proxy_pass $mf_reportes_upstream;
    }

    # --- El shell, en la raíz -----------------------------------------------
    # Va al final: es el `location` menos específico y recoge todo lo demás,
    # incluidas las rutas del router del cliente (/mis-reservas y compañía).
    location / {
        proxy_pass $shell_upstream;
    }
}
