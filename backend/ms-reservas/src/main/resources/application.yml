spring:
  application:
    name: ms-reservas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas_db}
    username: ${DB_USERNAME:reservas_app}
    password: ${DB_PASSWORD:reservas_app}
  jpa:
    hibernate:
      # validate (no update): el esquema lo versiona Flyway. Ver taller, §4.1
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8083}

# ms-reservas no lee canchas_db: le pregunta a su dueño por HTTP (Principio IV).
# Lo consume RestClientConfig para construir el cliente de CourtClientAdapter.
servicios:
  canchas-url: ${MS_CANCHAS_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
