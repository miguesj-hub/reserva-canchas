openapi: 3.1.0
info:
  title: ms-reservas — configuración de la política de reservas
  version: 1.0.0
  description: |
    **Extensión** del contrato de `ms-reservas` definido en
    `specs/001-reserva-canchas-deportivas/contracts/reservas.yaml`. Este archivo
    declara únicamente el recurso que añade la feature 002; el resto de
    `/api/reservas` —disponibilidad, creación, listados y cancelación— sigue
    definido en 001 y no se repite aquí.

    La razón de no copiar el contrato entero está en R-010: dos documentos
    completos del mismo servicio serían dos fuentes de verdad que divergen, y el
    README de contratos de 001 establece que manda el documento escrito.

    Expone y modifica `max_reservas_activas`, el tope que RN-06 aplica a un
    usuario final y que hoy solo se puede cambiar con un UPDATE a mano. Entra en
    alcance por la enmienda 1.3.0 de la constitución.

    La identidad y el rol llegan en `X-User-Id` y `X-User-Role`, escritas por el
    gateway; este servicio no autentica.
servers:
  - url: http://localhost/api
  - url: http://localhost:8083

tags:
  - name: configuracion
    description: Parámetros de la política de reservas (RN-06)

paths:
  /reservas/configuracion:
    get:
      tags: [configuracion]
      summary: Consultar el tope de reservas activas simultáneas
      description: |
        Implementa FR-052. Devuelve el valor vigente de `max_reservas_activas`,
        el tope que RN-06 aplica a un usuario final.

        Solo ADMINISTRADOR: un usuario final recibe 403 (FR-056).
      responses:
        '200':
          description: El tope vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracionResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }
    put:
      tags: [configuracion]
      summary: Cambiar el tope de reservas activas simultáneas
      description: |
        Implementa FR-053 a FR-056. El valor nuevo rige para las reservas que se
        creen a partir de la respuesta, **sin reiniciar ni redesplegar**: la
        clave se lee en cada creación de reserva (ver R-010).

        **No es retroactivo.** Las reservas ya confirmadas de un usuario que
        supere un tope recién reducido se conservan y siguen ocupando sus
        bloques; ese usuario simplemente no puede crear más hasta bajar del tope
        nuevo (FR-055).

        Solo ADMINISTRADOR: un usuario final recibe 403 (FR-056).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracionRequest' }
      responses:
        '200':
          description: El tope ya actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracionResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

components:
  schemas:
    ConfiguracionRequest:
      type: object
      required: [maxReservasActivas]
      properties:
        maxReservasActivas:
          type: integer
          minimum: 1
          example: 3
          description: |
            Tope de reservas activas simultáneas por usuario final (RN-06).
            Entero mayor o igual a 1; cualquier otro valor se rechaza con 400 y
            el tope anterior sigue vigente (FR-054).

    ConfiguracionResponse:
      type: object
      required: [maxReservasActivas]
      properties:
        maxReservasActivas: { type: integer, example: 3 }

    Error:
      type: object
      description: |
        Mismo cuerpo de error uniforme que el resto de `ms-reservas`, producido
        por el `ErrorHandler` ya existente. Se repite aquí para que este archivo
        se pueda validar por sí solo.
      required: [timestamp, status, error, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 403 }
        error: { type: string, example: Forbidden }
        message: { type: string }
        path: { type: string, example: /api/reservas/configuracion }

  responses:
    SolicitudInvalida:
      description: El tope no es un entero mayor o igual a 1 (FR-054)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NoAutenticado:
      description: Credenciales ausentes, inválidas o cuenta inactiva
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RolInsuficiente:
      description: El rol no permite la operación (FR-056)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - basicAuth: []
