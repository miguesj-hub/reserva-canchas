openapi: 3.1.0
info:
  title: ms-reservas — reservas y disponibilidad
  version: 1.0.0
  description: |
    Creación, consulta y cancelación de reservas, y cálculo de disponibilidad.
    Dueño de `reservas_db` y de las reglas RN-01 a RN-06 y RN-08.

    Las reglas viven en `BookingService` (`application/service/`), no en el
    controlador ni en el frontend (Principio II). La identidad y el rol llegan
    en `X-User-Id` y `X-User-Role`, escritas por el gateway; este servicio no
    autentica.

    RN-02 está garantizada además por una restricción EXCLUDE de PostgreSQL
    (ver data-model.md): el 409 de bloque ocupado llega por la comprobación
    previa en el caso normal, y por la restricción cuando dos peticiones
    compiten. El cliente no puede distinguirlos.
servers:
  - url: http://localhost/api
  - url: http://localhost:8083

tags:
  - name: disponibilidad
    description: Consulta de disponibilidad (§3.3.1)
  - name: reservas
    description: Creación, consulta y cancelación (§3.3.2, §3.3.3)

paths:
  /reservas/disponibilidad:
    get:
      tags: [disponibilidad]
      summary: Consultar los bloques de una cancha en una fecha
      description: |
        Implementa FR-007 a FR-011. Devuelve **todos** los bloques del horario de
        atención de la cancha, cada uno marcado como libre u ocupado; los
        comprendidos en un bloqueo de mantenimiento se marcan como tal y no son
        reservables. Disponible para ambos roles.

        El horario de atención y los bloqueos se obtienen de `ms-canchas` por
        `CourtClientPort`: este servicio no lee `canchas_db`.
      parameters:
        - name: canchaId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: fecha
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Los bloques de esa cancha y fecha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisponibilidadResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /reservas:
    post:
      tags: [reservas]
      summary: Crear una reserva
      description: |
        Implementa FR-012 a FR-018. Solo USUARIO_FINAL: §3.1 no le asigna esta
        acción al administrador, así que un ADMINISTRADOR recibe 403 (FR-018).

        El dueño de la reserva es siempre quien la pide, tomado de `X-User-Id`.
        El cuerpo no lleva `usuarioId`: aceptarlo permitiría reservar a nombre
        de otro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaRequest' }
      responses:
        '201':
          description: Reserva creada en estado CONFIRMADA (RN-08)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: |
            Un ADMINISTRADOR no crea reservas (FR-018, §3.1).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: |
            Conflicto con el estado actual. Dos motivos posibles, distinguibles
            por el mensaje:

            - **Bloque ya ocupado (RN-02)** — `SlotAlreadyBookedException`. Es el
              409 que la rúbrica señala explícitamente. Llega tanto de la
              comprobación previa como de la restricción EXCLUDE cuando dos
              peticiones simultáneas compiten por el mismo bloque: exactamente
              una se confirma.
            - **Tope de reservas activas alcanzado (RN-06)** —
              `ActiveBookingLimitExceededException`. El mensaje indica el tope y
              cuántas activas tiene el usuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                bloqueOcupado:
                  summary: RN-02
                  value:
                    timestamp: '2026-09-15T18:42:11'
                    status: 409
                    error: Conflict
                    message: El bloque 19:00-20:00 de la cancha 3 ya está reservado
                    path: /api/reservas
                topeAlcanzado:
                  summary: RN-06
                  value:
                    timestamp: '2026-09-15T18:42:11'
                    status: 409
                    error: Conflict
                    message: Ya tienes 3 reservas activas, que es el máximo permitido
                    path: /api/reservas
        '422':
          description: |
            La cancha existe pero no admite la reserva: está inactiva (FR-011),
            el bloque cae fuera de su horario de atención, coincide con un
            bloqueo de mantenimiento, o la fecha y hora ya pasaron (FR-016).
            Reintentar no cambia el resultado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    get:
      tags: [reservas]
      summary: Listar todas las reservas del sistema
      description: |
        Implementa FR-035. Solo ADMINISTRADOR: es el listado global de §3.2.
        Lo consume también `ms-reportes` por `BookingsClientPort`.
      parameters:
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
        - name: canchaId
          in: query
          schema: { type: integer, format: int64 }
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoReserva' }
      responses:
        '200':
          description: Listado global, sin paginación
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservaResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

  /reservas/mias:
    get:
      tags: [reservas]
      summary: Listar las reservas propias
      description: |
        Implementa FR-025 y FR-026. El filtro es `X-User-Id`, no un parámetro:
        no hay forma de pedir las reservas de otro.
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoReserva' }
      responses:
        '200':
          description: Solo las reservas de quien pregunta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservaResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /reservas/{id}:
    get:
      tags: [reservas]
      summary: Consultar una reserva
      description: Un USUARIO_FINAL solo puede consultar las suyas (403 si no lo es).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: La reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /reservas/{id}/cancelacion:
    post:
      tags: [reservas]
      summary: Cancelar una reserva
      description: |
        Implementa FR-019 a FR-024. Una sola operación para ambos roles: la
        diferencia la aplica `BookingService` leyendo `X-User-Role`.

        - USUARIO_FINAL: solo sus propias reservas (RN-03).
        - ADMINISTRADOR: cualquiera del sistema (RN-03).
        - Ambos: solo si la hora de inicio no ha ocurrido (RN-04).

        Al cancelar, la reserva pasa a CANCELADA y su bloque queda libre
        (RN-05): la restricción EXCLUDE deja de alcanzarla porque solo aplica a
        las confirmadas. La fila no se borra, para conservar la traza de RN-08 y
        alimentar el reporte de cancelaciones.

        Es un POST sobre un subrecurso y no un DELETE, porque la reserva no
        desaparece: cambia de estado.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Reserva cancelada, o ya estaba cancelada (FR-023, sin efecto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaResponse' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: |
            Un USUARIO_FINAL intenta cancelar una reserva ajena (RN-03). Es 403 y
            no 404 a propósito: fingir que no existe oculta el motivo real.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            La hora de inicio ya ocurrió: no se cancelan reservas pasadas ni en
            curso (RN-04, FR-028). Aplica igual al ADMINISTRADOR.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    EstadoReserva:
      type: string
      enum: [CONFIRMADA, CANCELADA, FINALIZADA]
      description: |
        Los tres estados de RN-08 (R-007). FINALIZADA se deriva del paso del
        tiempo: una reserva confirmada cuyo bloque ya terminó. No cuenta como
        activa para RN-06 y no se puede cancelar.

    ReservaRequest:
      type: object
      description: 'Sin `usuarioId`: el dueño es siempre quien hace la petición.'
      required: [canchaId, fecha, horaInicio]
      properties:
        canchaId:   { type: integer, format: int64 }
        fecha:      { type: string, format: date, examples: ['2026-09-15'] }
        horaInicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['19:00'] }

    ReservaResponse:
      type: object
      required: [id, canchaId, canchaNombre, deporte, usuarioId, fecha, horaInicio, horaFin, estado]
      properties:
        id:           { type: integer, format: int64 }
        canchaId:     { type: integer, format: int64 }
        canchaNombre: { type: string, description: 'Denormalizado en la respuesta desde ms-canchas, para que la pantalla no encadene llamadas' }
        deporte:      { type: string, enum: [PADEL, TENIS, BASQUET] }
        usuarioId:    { type: integer, format: int64 }
        usuarioNombre: { type: string, description: 'Solo en el listado global del administrador' }
        fecha:        { type: string, format: date }
        horaInicio:   { type: string, examples: ['19:00'] }
        horaFin:      { type: string, examples: ['20:00'] }
        estado:       { $ref: '#/components/schemas/EstadoReserva' }
        creadaEn:     { type: string, format: date-time }
        canceladaEn:  { type: string, format: date-time }

    Bloque:
      type: object
      required: [horaInicio, horaFin, estado]
      properties:
        horaInicio: { type: string, examples: ['19:00'] }
        horaFin:    { type: string, examples: ['20:00'] }
        estado:
          type: string
          enum: [LIBRE, OCUPADO, MANTENIMIENTO]
          description: Solo LIBRE es reservable.

    DisponibilidadResponse:
      type: object
      required: [canchaId, fecha, bloques]
      properties:
        canchaId: { type: integer, format: int64 }
        fecha:    { type: string, format: date }
        bloques:
          type: array
          description: Todos los bloques del horario de atención, en orden.
          items: { $ref: '#/components/schemas/Bloque' }

    Error:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status:    { type: integer }
        error:     { type: string }
        message:   { type: string }
        path:      { type: string }

  responses:
    SolicitudInvalida:
      description: Cuerpo o parámetros inválidos, o rango de fechas invertido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NoAutenticado:
      description: Credenciales ausentes, inválidas o cuenta inactiva
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RolInsuficiente:
      description: El rol no permite la operación (FR-006)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NoEncontrado:
      description: La reserva o la cancha no existe
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - basicAuth: []
